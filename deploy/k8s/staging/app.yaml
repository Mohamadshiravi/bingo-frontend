apiVersion: v1
kind: Namespace
metadata:
  name: _namespace_
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: _project_
  namespace: _namespace_
  labels:
    app: _project_
spec:
  selector:
    matchLabels:
      app: _project_
  template:
    metadata:
      name: _project_
      namespace: _namespace_
      labels:
        app: _project_
    spec:
      containers:
        - name: _project_
          image: _image_
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 3
            periodSeconds: 3
      imagePullSecrets:
        - name: _pull_secret_
---
apiVersion: v1
kind: Service
metadata:
  name: _project_
  namespace: _namespace_
spec:
  selector:
    app: _project_
  ports:
    - port: 80
      targetPort: http
      name: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: _project_
  namespace: _namespace_
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: public
  rules:
    - host: _domain_
      http:
        paths:
          - backend:
              service:
                name: _project_
                port:
                  name: http
            path: /
            pathType: Prefix

